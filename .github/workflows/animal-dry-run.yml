name: Animal Dry Run
on:
  workflow_dispatch:
    inputs:
      count:
        default: '5'
concurrency:
  group: auto-video-generation-animal
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: PYTHONPATH=scripts uv run python -m animal_topics.cli restore
      - name: Dry run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: PYTHONPATH=scripts uv run python -m animal_topics.cli dry-run --count ${{ inputs.count }} >> "$GITHUB_STEP_SUMMARY"
