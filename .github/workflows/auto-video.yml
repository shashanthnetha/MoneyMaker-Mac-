name: Auto Video Generator

on:
  schedule:
    # Every 2 hours. Adjust the cron expression to change frequency.
    # Tip: '0 */4 * * *' = every 4 hours, '0 */6 * * *' = every 6 hours.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Manual topic override (leave empty to pick automatically)'
        required: false
        default: ''

# Prevent overlapping runs. If a previous run is still generating a video,
# new triggers are skipped (NOT cancelled) so a mid-render job is never killed.
concurrency:
  group: auto-video-generation
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write  # Required to push topic_history.json back to the repo.

    steps:
      # ── Setup ─────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      # FIX: actually install ffmpeg (it was missing on the runner) and fail
      # loudly if it is not available. ffprobe is needed for the audio check.
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # ── Build config.toml from secrets ────────────────────────────────
      - name: Build config.toml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python scripts/build_config.py

      # ── Pick a topic ──────────────────────────────────────────────────
      - name: Pick video topic
        id: topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # FIX: pass through env instead of pasting into the shell script.
          MANUAL_TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$MANUAL_TOPIC" ]; then
            TOPIC="$MANUAL_TOPIC"
            echo "Using manual topic override: $TOPIC"
          else
            TOPIC=$(python scripts/pick_topic.py)
          fi
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "### 🎬 Chosen Topic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> $TOPIC" >> "$GITHUB_STEP_SUMMARY"

      # ── Generate the video ────────────────────────────────────────────
      - name: Generate video
        id: generate
        env:
          # FIX: pass through env instead of pasting into the shell script.
          TOPIC: ${{ steps.topic.outputs.topic }}
        run: |
          # Create a known task ID so we can find the output files reliably
          # without parsing CLI stdout (which also streams log output).
          TASK_ID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "Starting generation for task $TASK_ID ..."

          uv run python cli.py \
            --task-id "$TASK_ID" \
            --video-subject "$TOPIC" \
            --video-language en-US \
            --voice-name "en-US-AndrewNeural-Male" \
            --video-aspect 9:16 \
            --paragraph-number 2 \
            --video-count 1 \
            --bgm-type random \
            --bgm-volume 0.15

          # FIX (main bug): always use final-1.mp4 (voice + subtitles + BGM).
          # The old `find ... | head -1` could return combined-1.mp4, which is
          # only the silent stock-clip stitch with no voice or subtitles.
          VIDEO_FILE="storage/tasks/$TASK_ID/final-1.mp4"
          if [ ! -f "$VIDEO_FILE" ]; then
            VIDEO_FILE=""
          fi
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

          if [ -z "$VIDEO_FILE" ]; then
            echo "::error::final-1.mp4 not found in storage/tasks/$TASK_ID"
            ls -lR "storage/tasks/$TASK_ID" || true
            exit 1
          fi

          # FIX: refuse to continue if the video has no audio track,
          # so a silent video can never be uploaded publicly.
          AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO_FILE" | wc -l)
          if [ "$AUDIO_STREAMS" -lt 1 ]; then
            echo "::error::$VIDEO_FILE has no audio track, refusing to upload"
            exit 1
          fi

          FILE_SIZE=$(stat --printf='%s' "$VIDEO_FILE" 2>/dev/null || stat -f '%z' "$VIDEO_FILE")
          FILE_SIZE_MB=$(echo "scale=1; $FILE_SIZE / 1048576" | bc)

          echo "### ✅ Video Generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task ID | \`$TASK_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Video | \`$VIDEO_FILE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | ${FILE_SIZE_MB} MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Audio streams | ${AUDIO_STREAMS} |" >> "$GITHUB_STEP_SUMMARY"

      # ── Upload to YouTube ─────────────────────────────────────────────
      - name: Upload to YouTube
        id: upload
        if: steps.generate.outputs.video_file != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # FIX: pass through env instead of pasting into the shell script.
          TOPIC: ${{ steps.topic.outputs.topic }}
          VIDEO_FILE: ${{ steps.generate.outputs.video_file }}
        run: |
          uv run python scripts/upload_youtube.py \
            --video-file "$VIDEO_FILE" \
            --title "$TOPIC" \
            --privacy public

          echo "### 📤 Uploaded to YouTube" >> "$GITHUB_STEP_SUMMARY"

      # ── Persist topic history ─────────────────────────────────────────
      - name: Commit topic history
        # Run even if upload fails — we still want to record the topic
        # to avoid repeating it on the next run.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/topic_history.json
          # --quiet exits 0 when there's nothing to commit (idempotent).
          if ! git diff --cached --quiet; then
            git commit -m "chore: update topic history [skip ci]"
            # Rebase in case someone pushed between checkout and now.
            git pull --rebase origin "$(git branch --show-current)"
            git push
            echo "✓ Topic history committed and pushed"
          else
            echo "No topic history changes to commit"
          fi

      # ── Final summary ─────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          TOPIC: ${{ steps.topic.outputs.topic }}
          TASK_ID: ${{ steps.generate.outputs.task_id }}
          VIDEO_FILE: ${{ steps.generate.outputs.video_file }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo ""
          echo "=========================================="
          echo "  TOPIC:     $TOPIC"
          echo "  TASK ID:   $TASK_ID"
          echo "  VIDEO:     $VIDEO_FILE"
          echo "  GENERATE:  $GENERATE_OUTCOME"
          echo "  UPLOAD:    $UPLOAD_OUTCOME"
          echo "=========================================="
